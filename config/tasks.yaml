# pxb7-price-monitor 采集任务配置（dim_task 的配置源）
# 依据：docs/01 §2（URL 规律与筛选器 schema）/ §3.1-4（限速与轮次）/ §4（dim_task）/ §8 W1（原神官服单任务 MVP）
#
# 说明：
# - 任务只描述"采什么"；限速与风控阈值是全局硬逻辑，在 config/settings.yaml，任务不可覆写放松。
# - keyword_filter 为空数组 = 不做词表分域过滤（docs/02 §3 用途 1：非空时按 segment 词切片）。
# - 力度约束：pages_per_run ≤ settings.rate_limit.max_pages_per_run(5)；
#   runs_per_day ∈ settings.rate_limit.runs_per_day([2,4])。加载时由 pxb7/config.py 校验。

tasks:
  - task_id: genshin_official
    name: 原神-官服
    game_id: 10026                 # docs/01 §2 实测 gameId
    biz_prod: 1                    # 1=账号（4=道具，2=充值）
    enabled: true
    sort: comprehensive            # 综合 / newest 最新 / price 价格 / favorite 收藏（docs/01 §2 排序器）
    # 站内筛选器即属性字典（docs/01 §2）。留空 = 不设筛选，采该切片全部挂牌。
    # 可用键（实测筛选面板，接入时按需填写）：
    #   price_min / price_max（价格区间）
    #   level_min / level_max（冒险等级）
    #   five_star_chars_min / five_star_chars_max（五星角色数量）
    #   yellow_min / yellow_max（黄数）
    #   primogems_min / primogems_max（原石区间）
    #   intertwined_min / intertwined_max（纠缠之源区间）
    filter: {}
    keyword_filter: []             # v1.1 词表分域词（docs/02 §3）；空 = 不过滤
    pages_per_run: 5               # 每任务每轮页数上限（docs/01 §3.1-4：≤5 页）
    runs_per_day: 3                # 每任务每日轮次（docs/01 §3.1-4：2–4 轮）
    notes: "W1 MVP 单任务：登录态优先 + Playwright 渲染 + DOM 卡片解析（docs/01 §8）。注意：filter={} 的全量切片远大于 5 页/轮窗口，下架推断被有意禁用（覆盖不完整 ⇒ fct_delist_event 恒为 0）；要启用下架推断需把 filter 收窄到 ≤5 页可完整覆盖的切片"

  # --- 以下为「目标采集」多选目标（看板/扩展弹窗可勾选；docs/02 §2 分类与 §4 词表） ---
  # 说明：非原神任务的站内筛选器 schema 尚未实测（filter 一律留空 = 全量切片）；
  #       词表画像见 dim_game.keyword_profile，未建画像的游戏按 docs/02 §7 先建词表再接入。
  - task_id: wuwa_official
    name: 鸣潮-官服
    game_id: 10302                 # docs/02 §4.A4 鸣潮
    biz_prod: 1
    enabled: true
    sort: comprehensive
    filter: {}
    keyword_filter: []
    pages_per_run: 3
    runs_per_day: 2
    notes: "docs/02 §4.A4：限定共鸣者满链/专属武器谐振/声骸毕业为锚点；0+1/2+1/6+1 记法与崩铁同构。词表画像 wuwa_v0（种子待补，接入后按 §7 校准）"

  - task_id: naruto_official
    name: 火影忍者-官服
    game_id: 10032                 # docs/02 §4.F 火影忍者手游
    biz_prod: 1
    enabled: true
    sort: comprehensive
    filter: {}
    keyword_filter: []
    pages_per_run: 3
    runs_per_day: 2
    notes: "docs/02 §4.F：绝版点券 S 忍为最强溢价；渠道服≈官服 1/3 价必须分域（floor 词）。词表画像 naruto_v0（种子待补）"

  - task_id: delta_official
    name: 三角洲行动-官服
    game_id: 10371                 # docs/02 §4.B 搜打撤
    biz_prod: 1
    enabled: true
    sort: comprehensive
    filter: {}
    keyword_filter: []
    pages_per_run: 3
    runs_per_day: 2
    notes: "docs/02 §4.B：总资产（哈夫币）直接计价 + 红皮/安全箱结构溢价；官方追缴事件进 fct_event。词表画像 delta_v0（种子待补）"
